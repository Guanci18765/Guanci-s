<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#101828"
    >

    <title>
        {% block title %}
            Inventurverwaltung
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>
    <header class="site-header">

        <div class="header-left">

            <a
                class="company-brand"
                href="/admin/"
                aria-label="Zur Inventurübersicht"
            >
                <span class="company-logo-shell">
                    <img
                        class="company-logo"
                        src="/static/images/logo.jpg"
                        alt="Firmenlogo"
                    >
                </span>

                <span class="product-name">
                    <strong>Inventur</strong>
                    <small>Device Management</small>
                </span>
            </a>


            <nav
                class="portal-navigation"
                aria-label="Bereichsauswahl"
            >
                <a
                    class="portal-link"
                    href="/admin/"
                >
                    <span class="brand-mark">
                        AD
                    </span>

                    <span class="portal-text">
                        <strong>Admin</strong>
                        <small>Verwaltung</small>
                    </span>
                </a>


                <a
                    class="portal-link"
                    href="/kiosk/"
                >
                    <span class="brand-mark kiosk-mark">
                        KI
                    </span>

                    <span class="portal-text">
                        <strong>Kiosk</strong>
                        <small>Ausleihe</small>
                    </span>
                </a>
            </nav>

        </div>


        <div class="header-actions">
            {% block header_actions %}
            {% endblock %}
        </div>

    </header>


    <main class="page-shell">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
