<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <title>
        {% block title %}
            Inventur
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

</head>


<body>

    <header class="site-header">

        <div class="header-left">

            <a
                class="company-logo-link"
                href="/admin/"
                aria-label="Zur Admin-Übersicht"
            >

                <img
                    class="company-logo"
                    src="/static/images/logo.jpg"
                    alt="Firmenlogo"
                >

            </a>


            <nav
                class="portal-navigation"
                aria-label="Bereichsauswahl"
            >

                <a
                    class="portal-link"
                    href="/admin/"
                >

                    <span class="brand-mark">
                        Admin
                    </span>


                </a>


                <a
                    class="portal-link"
                    href="/kiosk/"
                >

                    <span class="brand-mark kiosk-mark">
                        Kiosk
                    </span>

                </a>

            </nav>

        </div>


        <div class="header-actions">

            {% block header_actions %}
            {% endblock %}

        </div>

    </header>


    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
