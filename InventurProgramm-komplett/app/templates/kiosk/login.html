{% extends "base.html" %}

{% block title %}
    Kiosk-Anmeldung · Inventur
{% endblock %}


{% block content %}

<section class="scan-shell">

    <article class="card auth-card">

        <p class="eyebrow">
            Ausleihterminal
        </p>

        <h1>
            Kiosk anmelden
        </h1>

        <p class="muted">
        Melde dieses Gerät als Ausleihterminal an.
        </p>


        {% if error %}

            <div class="alert alert-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="post"
            action="/kiosk/login"
            class="stacked-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >


            <label>

                Kiosk-PIN

                <input
                    type="password"
                    name="pin"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                    autofocus
                >

            </label>


            <button
                class="button button-primary button-full"
                type="submit"
            >
                Als Kiosk anmelden
            </button>

        </form>

    </article>

</section>

{% endblock %}
